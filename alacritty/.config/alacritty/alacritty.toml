
[general]
import = ["~/.config/alacritty/themes/dracula.toml"]
live_config_reload = true

[keyboard]
bindings = [
  # Vi mode (navigate output like vim)
  { key = "LBracket", mods = "Control", action = "ToggleViMode" },

  # Scroll in vi-style (mode = "Vi" prevents conflict with vim's own Ctrl+U/D)
  { key = "U", mods = "Control", action = "ScrollHalfPageUp", mode = "Vi" },
  { key = "D", mods = "Control", action = "ScrollHalfPageDown", mode = "Vi" },

  # Font size
  { key = "=", mods = "Control", action = "IncreaseFontSize" },
  { key = "-", mods = "Control", action = "DecreaseFontSize" },
  { key = "0", mods = "Control", action = "ResetFontSize" },

  # New instance
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
]

# ==============================================================
# FONT
# ==============================================================
[font]
size = 12.0

[font.normal]
family = "JetbrainsMono NF"
style = "Regular"

[font.bold]
family = "JetbrainsMono NF"
style = "Bold"

[font.italic]
family = "JetbrainsMono NF"
style = "Italic"

[font.bold_italic]
family = "JetbrainsMono NF"
style = "Bold Italic"

# ==============================================================
# WINDOW
# ==============================================================
[window]
opacity = 0.90
decorations = "full"   # "full" | "none" | "transparent" (macOS)
dynamic_padding = true # center content when window is resized

[window.padding]
x = 0
y = 0

[window.dimensions]
columns = 0 # 0 = use system default
lines = 0

# ==============================================================
# SCROLLBACK
# ==============================================================
[scrolling]
history = 10000

# ==============================================================
# CURSOR
# ==============================================================
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 1000
unfocused_hollow = true
